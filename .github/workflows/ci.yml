name: CI - Daraz Automation Framework

# Trigger on every push and pull request to main/develop branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Allow this workflow to read repo contents
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: Lint & static checks (fast feedback, no browser needed)
  # ---------------------------------------------------------------
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax (py_compile)
        run: |
          python -m py_compile pages/base_page.py
          python -m py_compile pages/home_page.py
          python -m py_compile pages/login_page.py
          python -m py_compile pages/cart_page.py
          python -m py_compile pages/search_page.py
          python -m py_compile pages/product_page.py
          python -m py_compile utils/browser_factory.py
          python -m py_compile utils/data_reader.py
          python -m py_compile utils/redis_client.py
          python -m py_compile utils/config.py
          echo "All files compiled successfully"

  # ---------------------------------------------------------------
  # Job 2: BDD tests on Chromium (primary browser)
  # ---------------------------------------------------------------
  test-chromium:
    name: BDD Tests - Chromium
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (Chromium)
        run: python -m playwright install chromium --with-deps

      - name: Set up SQLite test database
        run: python db/setup_database.py

      - name: Create allure-results directory
        run: mkdir -p allure-results

      - name: Run BDD tests (headless Chromium)
        env:
          BROWSER: chromium
          HEADLESS: "true"
        run: |
          behave \
            --format allure_behave.formatter:AllureFormatter \
            --outfile allure-results/ \
            --format plain \
            --no-capture \
            --tags "~@wip" || true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-chromium
          path: allure-results/
          retention-days: 7

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots-chromium
          path: screenshots/
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3: BDD tests on Firefox (cross-browser requirement)
  # ---------------------------------------------------------------
  test-firefox:
    name: BDD Tests - Firefox
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (Firefox)
        run: python -m playwright install firefox --with-deps

      - name: Set up SQLite test database
        run: python db/setup_database.py

      - name: Create allure-results directory
        run: mkdir -p allure-results

      - name: Run BDD tests (headless Firefox)
        env:
          BROWSER: firefox
          HEADLESS: "true"
        run: |
          behave \
            --format allure_behave.formatter:AllureFormatter \
            --outfile allure-results/ \
            --format plain \
            --no-capture \
            --tags "~@wip" || true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-firefox
          path: allure-results/
          retention-days: 7

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots-firefox
          path: screenshots/
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 4: Generate combined Allure HTML report
  # ---------------------------------------------------------------
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [ test-chromium, test-firefox ]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Chromium results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chromium
          path: allure-results/

      - name: Download Firefox results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: allure-results/

      - name: Set up Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure HTML report
        run: allure generate allure-results/ --clean -o allure-report/

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 14
